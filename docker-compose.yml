name: hundred-seconds

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port defaults to 5433 to avoid clashing with a local PostgreSQL
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_HOST_PORT:-8088}
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    # Not published on the host: the web app reaches it through Nginx

  web_app:
    build: ./web_app
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
