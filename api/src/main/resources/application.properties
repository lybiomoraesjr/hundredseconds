spring.application.name=hundred-seconds-api
server.port=${SERVER_PORT:8080}

# Local development: load variables from the project root .env when it exists
spring.config.import=optional:file:../.env[.properties]

# Datasource (overridable through environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/hundred_seconds}
spring.datasource.username=${DATABASE_USERNAME:hundred_seconds}
spring.datasource.password=${DATABASE_PASSWORD:hundred_seconds_dev}

# JPA: schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (secret must have at least 32 bytes and has no default on purpose)
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION:24h}
security.jwt.issuer=hundred-seconds-api

# Game
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator: only the health endpoint is exposed (used by the Docker health check)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
